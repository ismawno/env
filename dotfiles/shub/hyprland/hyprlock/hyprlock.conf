# The current look's colours, written by look-pick.
source = ~/.config/hypr/look-hyprlock.conf

# monospace is the current look's font, through the fontconfig alias look-pick sets.
$font = monospace

background {
    path = ~/.config/backgrounds/current
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

label {
    text = $TIME
    text_align = center
    color = $look_fg
    font_size = 40
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2
    outer_color = rgba(0, 0, 0, 0)
    inner_color = $look_input_fill
    font_color = $look_input_text
    font_family = $font
    placeholder_text = <i><span foreground="$look_fg_markup">🔒  Enter Pass</span></i>
    position = 0, -200
    halign = center
    valign = center
}
