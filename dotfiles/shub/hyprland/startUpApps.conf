# apps that are started with hyprland

exec-once = copyq --start-server
# swaync: started by its D-Bus-activated unit; an exec-once copy only makes that unit fail.
exec-once = hyprpaper -c ~/.config/hypr/hyprpaper/hyprpaper.conf
exec-once = waybar -c ~/.config/waybar/config -s ~/.config/waybar/style.css
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 
exec-once = /usr/libexec/xdg-desktop-portal-hyprland 
exec-once = /usr/libexec/xdg-desktop-portal
exec-once = copyq --start-server
exec-once = copyq --start-server
